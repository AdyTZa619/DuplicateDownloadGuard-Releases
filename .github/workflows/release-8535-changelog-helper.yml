name: DDG 8.5.35 changelog helper

on:
  push:
    branches:
      - 'feature/provider-preview-proxy'

permissions:
  contents: write

jobs:
  changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-preview-proxy
      - name: Add 8.5.35 changelog section
        shell: pwsh
        run: |
          ./.github/release-8535-changelog.ps1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Document 8.5.35 universal source engine'
            git push origin HEAD:feature/provider-preview-proxy
          }
