name: Prepare DDG 8.5.45

on:
  push:
    branches: [release/8.5.45]
    paths:
      - '.github/workflows/prepare-8545.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/8.5.45

      - name: Prepare release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '8.5.45'
          [System.IO.File]::WriteAllText((Join-Path $PWD 'VERSION'), "$version`n", [System.Text.UTF8Encoding]::new($false))

          $mainPath = Join-Path $PWD 'main.go'
          $main = [System.IO.File]::ReadAllText($mainPath)
          $pattern = 'const appVersion = "[^"]+"'
          if (-not [regex]::IsMatch($main, $pattern)) { throw 'appVersion lipsește din main.go' }
          $main = [regex]::Replace($main, $pattern, 'const appVersion = "8.5.45 Pro Smart Media Guard"', 1)
          [System.IO.File]::WriteAllText($mainPath, $main, [System.Text.UTF8Encoding]::new($false))

          $changelogPath = Join-Path $PWD 'CHANGELOG.md'
          $changelog = [System.IO.File]::ReadAllText($changelogPath)
          $lines = @(
            '## [8.5.45] — 2026-09-06',
            '',
            '### Download Studio — flux simplificat',
            '- Downloadul nu mai rescanează imediat aceleași HDD-uri când comparația tocmai a actualizat indexul local; reutilizează temporar indexul proaspăt și păstrează verificarea de siguranță.',
            '- Când toate fișierele selectate sunt sigure, un singur click pe „Descarcă” le pune direct în coadă și pornește transferul fără raport modal inutil.',
            '- Raportul Smart/Exact Guard apare numai când există duplicate, cazuri neclare sau erori; verificarea de integritate după download rămâne activă.',
            '',
            '### JDownloader',
            '- Rezultatele selectate pot fi trimise direct în JDownloader LinkGrabber prin interfața locală Click''n''Load/FlashGot.',
            '- Pentru GoFile se trimite un URL stabil bazat pe folder și ProviderID, nu URL-ul CDN temporar extras pentru preview/download intern.',
            '- FolderWatch rămâne fallback, iar fișierele .crawljob sunt generate în format JSON valid JDownloader.',
            '',
            '### Compatibilitate',
            '- MEGA Preview, scanarea GoFile și semantica de matching nu sunt modificate.',
            '- Testele și validarea Windows verifică noul flux de download și integrarea JDownloader.',
            '',
            ''
          )
          $section = $lines -join "`n"
          $rx = '(?ms)^## \[8\.5\.45\].*?(?=^## \[|\z)'
          if ([regex]::IsMatch($changelog, $rx)) {
            $changelog = [regex]::Replace($changelog, $rx, $section, 1)
          } else {
            $first = [regex]::Match($changelog, '(?m)^## \[')
            if (-not $first.Success) { throw 'Nu am găsit prima secțiune de versiune în CHANGELOG.md' }
            $changelog = $changelog.Insert($first.Index, $section)
          }
          [System.IO.File]::WriteAllText($changelogPath, $changelog, [System.Text.UTF8Encoding]::new($false))

          Remove-Item '.github/workflows/prepare-8545.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION main.go CHANGELOG.md .github/workflows/prepare-8545.yml
          git commit -m 'Prepare 8.5.45 release metadata'
          git push origin HEAD:release/8.5.45
