name: Apply v8.5.5 download core integration

on:
  push:
    branches: [fix/v8.5.5-download-core]
    paths:
      - tools/apply_download_v855.py
      - .github/workflows/apply-download-v855.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact patch
        run: python tools/apply_download_v855.py
      - name: Format Go
        run: gofmt -w v8_extra.go aria2_rpc.go download_core_v855.go download_core_v855_test.go
      - name: Verify UI syntax
        run: node --check web/exact_guard.js
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Windows x64
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -o DuplicateDownloadGuard_PRO_download_v855.exe .
      - name: Commit product patch only
        shell: pwsh
        run: |
          git rm tools/apply_download_v855.py .github/workflows/apply-download-v855.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v8_extra.go aria2_rpc.go web/exact_guard.js download_core_v855.go download_core_v855_test.go
          git commit -m "Rebuild download core for deterministic reliable transfers"
          git push origin HEAD:fix/v8.5.5-download-core
