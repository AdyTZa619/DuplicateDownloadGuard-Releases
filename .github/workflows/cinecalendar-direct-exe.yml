name: CineCalendar Windows Premium

on:
  push:
    branches: ["cinecalendar-direct-exe"]
    paths-ignore:
      - "CineCalendar/releases/**"
      - "CineCalendar/update.json"
      - "working_source/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Premium source tree
        shell: pwsh
        run: |
          $required = @(
            'CineCalendar\launcher.py',
            'CineCalendar\cinecalendar\recommendation.py',
            'CineCalendar\cinecalendar\qt_ui_v2.py',
            'CineCalendar\cinecalendar\premium_ui.py',
            'CineCalendar\cinecalendar\open_metadata.py',
            'CineCalendar\UPDATE_NOTES.txt'
          )
          foreach ($p in $required) { if (!(Test-Path $p)) { throw "Missing Premium source: $p" } }

      - name: Install dependencies
        working-directory: CineCalendar
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: CineCalendar
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Build fast portable folder
        working-directory: CineCalendar
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CineCalendar --manifest CineCalendar.manifest --hidden-import=sqlite3 launcher.py
          $exe = 'dist\CineCalendar\CineCalendar.exe'
          if (!(Test-Path $exe)) { throw 'Premium EXE was not created' }
          $b = [IO.File]::ReadAllBytes($exe)
          if ($b.Length -lt 2 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw 'Not a Windows PE executable' }
          Write-Host "Launcher EXE bytes: $($b.Length)"
          Write-Host "Portable folder bytes: $((Get-ChildItem 'dist\CineCalendar' -Recurse -File | Measure-Object Length -Sum).Sum)"
          Get-FileHash $exe -Algorithm SHA256

      - name: Smoke launch Premium
        working-directory: CineCalendar
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\CineCalendar\CineCalendar.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "Premium app exited with $($p.ExitCode)" }
          } else {
            Stop-Process -Id $p.Id -Force
          }

      - name: Package Premium portable build
        working-directory: CineCalendar
        shell: pwsh
        run: |
          $readme = @'
          CineCalendar 2.1 Premium

          PORNIRE: dublu-click CineCalendar.exe.
          Nu este necesar Python și nu se instalează nimic.
          IMPORTANT: păstrează CineCalendar.exe împreună cu folderul _internal și restul fișierelor din acest director.
          Datele personale sunt păstrate separat în CineCalendarData.
          Acest build folosește formatul portabil onedir pentru pornire mult mai rapidă decât vechiul EXE onefile.
          '@
          $readme | Set-Content -Encoding utf8NoBOM 'dist\CineCalendar\README.txt'
          Compress-Archive -Path 'dist\CineCalendar\*' -DestinationPath 'CineCalendar-2.1-Premium-Windows-x64.zip' -Force
          Get-FileHash 'CineCalendar-2.1-Premium-Windows-x64.zip' -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: CineCalendar-2.1-Premium-Windows-x64
          path: |
            CineCalendar/dist/CineCalendar/**
            CineCalendar/CineCalendar-2.1-Premium-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
