name: Prepare DDG 8.5.41

on:
  push:
    branches: [fix/gofile-guest-timeout-8541]
    paths:
      - '.github/workflows/prepare-8541.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gofile-guest-timeout-8541

      - name: Patch GoFile guest account flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('provider_http_transport.go')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'func gofileGuestTokenV86\(ctx context\.Context, base http\.RoundTripper\) \(string, error\) \{.*?\n\}\n\nfunc detectGalleryDLForProviderV86', re.S)
          replacement = r'''func gofileGuestRetryableStatusV86(status int) bool {
          switch status {
          case http.StatusRequestTimeout, http.StatusTooEarly, http.StatusTooManyRequests,
          		http.StatusInternalServerError, http.StatusBadGateway, http.StatusServiceUnavailable, http.StatusGatewayTimeout:
          	return true
          default:
          	return false
          }
          }

          func gofileGuestRetryDelayV86(attempt int, resp *http.Response) time.Duration {
          if resp != nil && resp.StatusCode == http.StatusTooManyRequests {
          	return gofileRetryAfterV86(resp)
          }
          delay := time.Duration(attempt+1) * 500 * time.Millisecond
          if delay > 2*time.Second {
          	delay = 2 * time.Second
          }
          return delay
          }

          func gofileGuestTokenV86(ctx context.Context, base http.RoundTripper) (string, error) {
          gofileTokenMuV86.Lock()
          defer gofileTokenMuV86.Unlock()
          if gofileTokenV86 != "" && time.Since(gofileTokenAtV86) < 3*time.Hour {
          	return gofileTokenV86, nil
          }
          if base == nil {
          	if wrapped, ok := http.DefaultTransport.(*providerAwareTransportV86); ok && wrapped.base != nil {
          		base = wrapped.base
          	} else {
          		base = http.DefaultTransport
          	}
          }

          const maxAttempts = 3
          const attemptTimeout = 15 * time.Second
          var lastErr error

          for attempt := 0; attempt < maxAttempts; attempt++ {
          	attemptCtx, cancel := context.WithTimeout(ctx, attemptTimeout)
          	req, err := http.NewRequestWithContext(attemptCtx, http.MethodPost, "https://api.gofile.io/accounts", bytes.NewBufferString("{}"))
          	if err != nil {
          		cancel()
          		return "", err
          	}
          	req.Header.Set("Origin", "https://gofile.io")
          	req.Header.Set("Referer", "https://gofile.io/")
          	req.Header.Set("User-Agent", gofileUserAgentV86)
          	req.Header.Set("Accept", "application/json")
          	req.Header.Set("Content-Type", "application/json")
          	req.Header.Set("X-BL", "en-US")
          	req.Header.Set("X-Website-Token", gofileWebsiteTokenV86("", time.Now()))

          	client := &http.Client{Transport: base}
          	resp, err := client.Do(req)
          	if err != nil {
          		cancel()
          		if ctx.Err() != nil {
          			return "", ctx.Err()
          		}
          		lastErr = fmt.Errorf("încercarea %d/%d: %w", attempt+1, maxAttempts, err)
          		if attempt+1 < maxAttempts {
          			if sleepErr := gofileSleepV86(ctx, gofileGuestRetryDelayV86(attempt, nil)); sleepErr != nil {
          				return "", sleepErr
          			}
          			continue
          		}
          		break
          	}

          	status := resp.StatusCode
          	retryDelay := gofileGuestRetryDelayV86(attempt, resp)
          	var env struct {
          		Status string `json:"status"`
          		Data   struct {
          			Token string `json:"token"`
          		} `json:"data"`
          	}
          	decodeErr := json.NewDecoder(resp.Body).Decode(&env)
          	_ = resp.Body.Close()
          	cancel()

          	if status >= 200 && status < 300 {
          		if decodeErr == nil && strings.EqualFold(strings.TrimSpace(env.Status), "ok") && strings.TrimSpace(env.Data.Token) != "" {
          			gofileTokenV86 = strings.TrimSpace(env.Data.Token)
          			gofileTokenAtV86 = time.Now()
          			return gofileTokenV86, nil
          		}
          		if strings.EqualFold(strings.TrimSpace(env.Status), "error-rateLimit") {
          			lastErr = errors.New("GoFile guest account: error-rateLimit")
          		} else if decodeErr != nil {
          			lastErr = fmt.Errorf("răspuns GoFile guest invalid: %w", decodeErr)
          		} else {
          			return "", fmt.Errorf("GoFile nu a returnat token guest (status %s)", strings.TrimSpace(env.Status))
          		}
          	} else if gofileGuestRetryableStatusV86(status) {
          		lastErr = fmt.Errorf("GoFile guest account HTTP %d", status)
          	} else {
          		return "", fmt.Errorf("GoFile guest account HTTP %d", status)
          	}

          	if attempt+1 < maxAttempts {
          		if sleepErr := gofileSleepV86(ctx, retryDelay); sleepErr != nil {
          			return "", sleepErr
          		}
          		continue
          	}
          }

          if lastErr == nil {
          	lastErr = errors.New("eroare necunoscută")
          }
          return "", fmt.Errorf("GoFile guest account indisponibil după %d încercări: %w", maxAttempts, lastErr)
          }

          func detectGalleryDLForProviderV86'''
          ns, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'guest function patch count={n}')
          p.write_text(ns, encoding='utf-8')

          t = Path('provider_http_transport_test.go')
          ts = t.read_text(encoding='utf-8')
          ts = ts.replace('import (\n\t"net/http"', 'import (\n\t"context"\n\t"io"\n\t"net/http"')
          if 'TestGofileGuestTokenRequestV8541' not in ts:
              ts += r'''

          type guestRoundTripFuncV8541 func(*http.Request) (*http.Response, error)

          func (f guestRoundTripFuncV8541) RoundTrip(r *http.Request) (*http.Response, error) { return f(r) }

          func TestGofileGuestTokenRequestV8541(t *testing.T) {
          invalidateGoFileGuestTokenV86()
          defer invalidateGoFileGuestTokenV86()
          calls := 0
          tr := guestRoundTripFuncV8541(func(r *http.Request) (*http.Response, error) {
          	calls++
          	if r.Method != http.MethodPost || r.URL.String() != "https://api.gofile.io/accounts" {
          		t.Fatalf("unexpected request: %s %s", r.Method, r.URL)
          	}
          	if got := r.Header.Get("X-BL"); got != "en-US" {
          		t.Fatalf("X-BL=%q", got)
          	}
          	if got := r.Header.Get("X-Website-Token"); len(got) != 64 {
          		t.Fatalf("website token missing: %q", got)
          	}
          	if got := r.Header.Get("Content-Type"); got != "application/json" {
          		t.Fatalf("content type=%q", got)
          	}
          	body, _ := io.ReadAll(r.Body)
          	if strings.TrimSpace(string(body)) != "{}" {
          		t.Fatalf("guest body=%q", string(body))
          	}
          	return &http.Response{
          		StatusCode: http.StatusOK,
          		Header:     make(http.Header),
          		Body:       io.NopCloser(strings.NewReader(`{"status":"ok","data":{"token":"guest-8541"}}`)),
          		Request:    r,
          	}, nil
          })
          token, err := gofileGuestTokenV86(context.Background(), tr)
          if err != nil {
          	t.Fatal(err)
          }
          if token != "guest-8541" || calls != 1 {
          	t.Fatalf("token=%q calls=%d", token, calls)
          }
          }

          func TestGofileGuestTokenRetriesTransientTimeoutV8541(t *testing.T) {
          invalidateGoFileGuestTokenV86()
          defer invalidateGoFileGuestTokenV86()
          calls := 0
          tr := guestRoundTripFuncV8541(func(r *http.Request) (*http.Response, error) {
          	calls++
          	if calls == 1 {
          		return nil, context.DeadlineExceeded
          	}
          	return &http.Response{
          		StatusCode: http.StatusOK,
          		Header:     make(http.Header),
          		Body:       io.NopCloser(strings.NewReader(`{"status":"ok","data":{"token":"guest-retry"}}`)),
          		Request:    r,
          	}, nil
          })
          token, err := gofileGuestTokenV86(context.Background(), tr)
          if err != nil {
          	t.Fatal(err)
          }
          if token != "guest-retry" || calls != 2 {
          	t.Fatalf("token=%q calls=%d", token, calls)
          }
          }
          '''
          t.write_text(ts, encoding='utf-8')

          Path('VERSION').write_text('8.5.41\n', encoding='utf-8')
          c = Path('CHANGELOG.md')
          cs = c.read_text(encoding='utf-8')
          section = '''## [8.5.41] - 2026-09-06
          - Repară timeout-ul la crearea tokenului guest GoFile: cererea `POST /accounts` folosește acum antetele web curente `X-Website-Token` și `X-BL`, plus corp JSON explicit.
          - Tokenul web pentru crearea contului este calculat cu account token gol, exact pentru etapa de guest-account, folosind același User-Agent ca cererile de metadata.
          - Timeout-urile de transport și răspunsurile temporare 408/425/429/5xx sunt reîncercate controlat de până la 3 ori; `429` respectă `Retry-After`.
          - Fiecare încercare are timeout propriu de 15 secunde, astfel încât o singură conexiune blocată nu mai aruncă imediat scanarea în fallback.
          - Tokenurile GoFile rămân numai în memorie; nu sunt persistate pe disc.
          - MEGA Preview, matching-ul și celelalte providere nu sunt modificate.

          '''.replace('          ', '')
          if not cs.startswith('## [8.5.41]'):
              c.write_text(section + cs, encoding='utf-8')
          PY

          gofmt -w provider_http_transport.go provider_http_transport_test.go
          go test ./...
          go vet ./...

      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/prepare-8541.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider_http_transport.go provider_http_transport_test.go VERSION CHANGELOG.md .github/workflows/prepare-8541.yml
          git commit -m 'Release 8.5.41: harden GoFile guest token creation'
          git push origin HEAD:fix/gofile-guest-timeout-8541
