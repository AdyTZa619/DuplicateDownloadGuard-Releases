name: Apply v8.5.4 queue identity patch
on:
  push:
    branches: [fix/v8.5.4-download-flow]
    paths:
      - tools/apply_download_identity_v854.py
      - .github/workflows/apply-download-identity-v854.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply identity patch
        shell: pwsh
        run: python tools/apply_download_identity_v854.py
      - name: Format
        shell: pwsh
        run: gofmt -w download_flow_v854.go download_queue_identity_v854.go download_flow_v854_test.go download_queue_identity_v854_test.go v8_extra.go
      - name: JavaScript syntax
        shell: pwsh
        run: node --check web/exact_guard.js
      - name: Tests
        shell: pwsh
        run: go test ./...
      - name: Vet
        shell: pwsh
        run: go vet ./...
      - name: Windows x64 build
        shell: pwsh
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go build -o DuplicateDownloadGuard_PRO_v854_validation.exe .
      - name: Commit validated product patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+AdyTZa619@users.noreply.github.com"
          git add -A
          git commit -m "Use stable remote identity for persistent download jobs"
          git push
