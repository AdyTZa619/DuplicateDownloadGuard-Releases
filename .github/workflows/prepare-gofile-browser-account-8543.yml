name: Prepare GoFile browser account 8543

on:
  push:
    branches:
      - fix/gofile-browser-account-8543

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gofile-browser-account-8543
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Apply patch payload
        run: python3 .github/scripts/patch_gofile_8543.py
      - name: Validate source
        shell: bash
        run: |
          gofmt -w provider_http_transport.go provider_http_transport_test.go
          go test ./...
          go vet ./...
      - name: Commit patch and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider_http_transport.go provider_http_transport_test.go
          git rm .github/workflows/prepare-gofile-browser-account-8543.yml .github/scripts/patch_gofile_8543.py
          git commit -m "Align GoFile guest account request with browser flow"
          git push origin HEAD:fix/gofile-browser-account-8543
