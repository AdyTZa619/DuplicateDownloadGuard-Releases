name: Prepare GoFile browser account 8543

on:
  push:
    branches:
      - fix/gofile-browser-account-8543

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gofile-browser-account-8543
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Patch GoFile guest account request
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('provider_http_transport.go')
          source = source_path.read_text(encoding='utf-8')
          start = source.index('func gofileGuestTokenV86(ctx context.Context, base http.RoundTripper) (string, error) {')
          end = source.index('\nfunc detectGalleryDLForProviderV86()', start)
          replacement = r'''const gofileGuestAttemptTimeoutV8543 = 8 * time.Second

func gofileGuestTokenV86(ctx context.Context, base http.RoundTripper) (string, error) {
	gofileTokenMuV86.Lock()
	defer gofileTokenMuV86.Unlock()

	// Reuse one account token for the whole process. Validity is decided by
	// GoFile itself when metadata is requested.
	if token := strings.TrimSpace(gofileTokenV86); token != "" {
		return token, nil
	}
	if configured := gofileConfiguredTokenV8542(); configured != "" {
		gofileTokenV86 = configured
		gofileTokenAtV86 = time.Now()
		return configured, nil
	}
	if cached, ok := loadCachedGofileGuestTokenV8542(); ok {
		gofileTokenV86 = cached
		gofileTokenAtV86 = time.Now()
		return cached, nil
	}
	if remaining := gofileGuestCooldownRemainingV8542(); remaining > 0 {
		return "", fmt.Errorf("GoFile guest account în cooldown încă %s după rate-limit", remaining.Round(time.Second))
	}

	if base == nil {
		if wrapped, ok := http.DefaultTransport.(*providerAwareTransportV86); ok && wrapped.base != nil {
			base = wrapped.base
		} else {
			base = http.DefaultTransport
		}
	}

	// The current GoFile web client creates a guest account with a plain POST
	// /accounts request. Do not attach the metadata-only website-token headers,
	// JSON Content-Type, or a synthetic body here. More importantly, do not burn
	// the whole 45 s native scan budget by retrying the same stalled request.
	attemptCtx, cancel := context.WithTimeout(ctx, gofileGuestAttemptTimeoutV8543)
	req, err := http.NewRequestWithContext(attemptCtx, http.MethodPost, "https://api.gofile.io/accounts", nil)
	if err != nil {
		cancel()
		return "", err
	}
	req.Header.Set("Origin", "https://gofile.io")
	req.Header.Set("Referer", "https://gofile.io/")
	req.Header.Set("User-Agent", gofileUserAgentV86)
	req.Header.Set("Accept", "application/json, text/plain, */*")
	req.Header.Set("Accept-Language", "en-US,en;q=0.9")
	req.Header.Set("Sec-Fetch-Dest", "empty")
	req.Header.Set("Sec-Fetch-Mode", "cors")
	req.Header.Set("Sec-Fetch-Site", "same-site")

	client := &http.Client{Transport: base}
	resp, err := client.Do(req)
	if err != nil {
		attemptTimedOut := attemptCtx.Err() == context.DeadlineExceeded && ctx.Err() == nil
		cancel()
		if ctx.Err() != nil {
			return "", ctx.Err()
		}
		if attemptTimedOut || errors.Is(err, context.DeadlineExceeded) {
			return "", fmt.Errorf("GoFile guest account nu a răspuns în %s; trec la fallback: %w", gofileGuestAttemptTimeoutV8543, err)
		}
		return "", fmt.Errorf("GoFile guest account indisponibil; trec la fallback: %w", err)
	}

	status := resp.StatusCode
	var env struct {
		Status string `json:"status"`
		Data   struct {
			Token string `json:"token"`
		} `json:"data"`
	}
	decodeErr := json.NewDecoder(resp.Body).Decode(&env)
	rateLimited := status == http.StatusTooManyRequests || strings.EqualFold(strings.TrimSpace(env.Status), "error-rateLimit")
	cooldown := time.Duration(0)
	if rateLimited {
		cooldown = gofileGuestCooldownDelayV8542(resp)
	}
	_ = resp.Body.Close()
	cancel()

	if rateLimited {
		setGofileGuestCooldownV8542(cooldown)
		return "", fmt.Errorf("GoFile guest account rate-limit; nu mai creez alte conturi timp de %s", cooldown.Round(time.Second))
	}
	if status >= 200 && status < 300 && decodeErr == nil && strings.EqualFold(strings.TrimSpace(env.Status), "ok") && strings.TrimSpace(env.Data.Token) != "" {
		token := strings.TrimSpace(env.Data.Token)
		gofileTokenV86 = token
		gofileTokenAtV86 = time.Now()
		clearGofileGuestCooldownV8542()
		_ = persistGofileGuestTokenV8542(token)
		return token, nil
	}
	if decodeErr != nil {
		return "", fmt.Errorf("răspuns GoFile guest invalid: %w", decodeErr)
	}
	return "", fmt.Errorf("GoFile guest account HTTP %d (%s)", status, strings.TrimSpace(env.Status))
}
'''
          source_path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          test_path = Path('provider_http_transport_test.go')
          tests = test_path.read_text(encoding='utf-8')
          test_start = tests.index('func TestGofileGuestTokenRequestV8541')
          new_tests = r'''func TestGofileGuestTokenRequestBrowserLikeV8543(t *testing.T) {
	setupGofileStateTestV8542(t)
	defer invalidateGoFileGuestTokenV86()
	calls := 0
	tr := guestRoundTripFuncV8541(func(r *http.Request) (*http.Response, error) {
		calls++
		if r.Method != http.MethodPost || r.URL.String() != "https://api.gofile.io/accounts" {
			t.Fatalf("unexpected request: %s %s", r.Method, r.URL)
		}
		if got := r.Header.Get("X-BL"); got != "" {
			t.Fatalf("X-BL must not be sent on guest account creation: %q", got)
		}
		if got := r.Header.Get("X-Website-Token"); got != "" {
			t.Fatalf("website token must not be sent on guest account creation: %q", got)
		}
		if got := r.Header.Get("Content-Type"); got != "" {
			t.Fatalf("content type must stay empty for bodyless POST: %q", got)
		}
		if r.Body != nil {
			body, _ := io.ReadAll(r.Body)
			if len(body) != 0 {
				t.Fatalf("guest request must be bodyless: %q", string(body))
			}
		}
		if r.Header.Get("Origin") != "https://gofile.io" || r.Header.Get("Referer") != "https://gofile.io/" {
			t.Fatalf("browser origin/referer missing: origin=%q referer=%q", r.Header.Get("Origin"), r.Header.Get("Referer"))
		}
		return &http.Response{
			StatusCode: http.StatusOK,
			Header:     make(http.Header),
			Body:       io.NopCloser(strings.NewReader(`{"status":"ok","data":{"token":"guest-8543"}}`)),
			Request:    r,
		}, nil
	})
	token, err := gofileGuestTokenV86(context.Background(), tr)
	if err != nil {
		t.Fatal(err)
	}
	if token != "guest-8543" || calls != 1 {
		t.Fatalf("token=%q calls=%d", token, calls)
	}
}

func TestGofileGuestTokenTransportFailureDoesNotRetryV8543(t *testing.T) {
	setupGofileStateTestV8542(t)
	defer invalidateGoFileGuestTokenV86()
	calls := 0
	tr := guestRoundTripFuncV8541(func(r *http.Request) (*http.Response, error) {
		calls++
		return nil, context.DeadlineExceeded
	})
	_, err := gofileGuestTokenV86(context.Background(), tr)
	if err == nil {
		t.Fatal("expected transport failure")
	}
	if calls != 1 {
		t.Fatalf("stalled guest creation must not be retried, calls=%d", calls)
	}
	if gofileGuestAttemptTimeoutV8543 > 10*time.Second {
		t.Fatalf("guest timeout too long: %s", gofileGuestAttemptTimeoutV8543)
	}
	if !strings.Contains(err.Error(), "trec la fallback") {
		t.Fatalf("fallback intent missing from error: %v", err)
	}
}
'''
          test_path.write_text(tests[:test_start] + new_tests, encoding='utf-8')
          PY
          gofmt -w provider_http_transport.go provider_http_transport_test.go
          go test ./...
          go vet ./...
      - name: Commit validated patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider_http_transport.go provider_http_transport_test.go
          git rm .github/workflows/prepare-gofile-browser-account-8543.yml
          git commit -m "Align GoFile guest account request with browser flow"
          git push origin HEAD:fix/gofile-browser-account-8543
