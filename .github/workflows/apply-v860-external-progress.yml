name: Apply v8.6 external download progress

on:
  push:
    branches:
      - feature/v8.6.0-media-orchestrator
    paths:
      - .github/workflows/apply-v860-external-progress.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v8.6.0-media-orchestrator
          fetch-depth: 0
      - name: Apply exact queue progress patch
        run: python tools/apply_v860_external_progress.py
      - name: Format
        run: |
          gofmt -w v8_extra.go external_download_progress_v860.go external_download_progress_v860_test.go
          git diff --check
      - name: JavaScript syntax
        run: |
          node --check web/preview_quick_v86.js
          node --check web/download_diagnostic_v860.js
          if [ -f web/quality_intelligence_v860.js ]; then node --check web/quality_intelligence_v860.js; fi
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Remove temporary helpers
        run: rm -f tools/apply_v860_external_progress.py .github/workflows/apply-v860-external-progress.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate live progress for external download engines"
          git push origin HEAD:feature/v8.6.0-media-orchestrator
