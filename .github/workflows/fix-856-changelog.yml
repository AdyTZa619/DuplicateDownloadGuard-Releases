name: Fix DDG 8.5.36 changelog

on:
  push:
    branches:
      - release/8.5.36

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix 8.5.36 changelog formatting') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/8.5.36
      - name: Fix changelog
        shell: pwsh
        run: ./fix_856_changelog.ps1
