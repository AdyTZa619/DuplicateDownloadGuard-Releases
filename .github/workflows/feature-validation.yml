name: DDG isolated feature validation

on:
  pull_request:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddg-feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-features:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Verify Go formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          Get-ChildItem -Filter *.go -File | ForEach-Object {
            $out = gofmt -l $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "gofmt failed: $($_.FullName)" }
            if ($out) { $bad += $out }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host $_ }
            throw 'Go formatting check failed'
          }

      - name: Verify all UI JavaScript syntax recursively
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(Get-ChildItem -Path web -Filter *.js -File -Recurse)
          if ($scripts.Count -eq 0) { throw 'Nu există fișiere JavaScript în web/.' }
          foreach ($script in $scripts) {
            Write-Host "node --check $($script.FullName)"
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($script.FullName)" }
          }

      - name: Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }

      - name: Vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }

      - name: Windows x64 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o DDG_FEATURE_VALIDATION.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 build failed' }
