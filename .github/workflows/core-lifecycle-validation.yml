name: DDG core lifecycle validation

on:
  push:
    branches:
      - 'core-migration/test117-backend-lifetime-v2'

permissions:
  contents: read

concurrency:
  group: ddg-core-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Go formatting
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Filter *.go | ForEach-Object {
            $out = gofmt -l $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "gofmt failed: $($_.Name)" }
            if ($out) { $bad += $out }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw 'Go formatting check failed' }
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path web -Filter *.js -File -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.FullName)" }
          }
      - name: Tests
        shell: pwsh
        run: go test ./...
      - name: Vet
        shell: pwsh
        run: go vet ./...
      - name: Windows x64 build
        shell: pwsh
        run: |
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o DDG_CORE_LIFECYCLE_VALIDATION.exe .
