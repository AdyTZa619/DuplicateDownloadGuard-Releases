name: TEST89 apply local thumb route

on:
  push:
    branches:
      - fix/test89-local-preview-cache

permissions:
  contents: write

jobs:
  patch-route:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test89-local-preview-cache
          fetch-depth: 0
      - name: Register local thumbnail route and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main.go')
          s = p.read_text(encoding='utf-8')
          needle = '\tmux.HandleFunc("/api/local-preview", a.handleLocalPreview)'
          route = '\tmux.HandleFunc("/api/local-thumb", a.handleLocalThumbV8574)'
          if route not in s:
              if needle not in s:
                  raise SystemExit('local preview route marker not found')
              s = s.replace(needle, needle + '\n' + route, 1)
              p.write_text(s, encoding='utf-8')
          Path('.github/workflows/test89-apply-route.yml').unlink(missing_ok=True)
          PY
          gofmt -w main.go local_preview_thumb_v8574.go local_preview_thumb_v8574_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to patch.'
            exit 0
          fi
          git commit -m 'TEST89: register cached local thumbnail endpoint'
          git push origin HEAD:fix/test89-local-preview-cache
