name: TEST127 gofmt once

on:
  push:
    branches:
      - feature/test127-generic-media-advanced

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/test127-generic-media-advanced
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format target files and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w generic_media_discovery_v85127.go generic_media_discovery_v85127_test.go generic_media_ui_v85127_test.go
          rm -f .github/workflows/test127-gofmt-once.yml
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generic_media_discovery_v85127.go generic_media_discovery_v85127_test.go generic_media_ui_v85127_test.go .github/workflows/test127-gofmt-once.yml
          git commit -m 'TEST127: apply gofmt to generic media feature'
          git push origin HEAD:feature/test127-generic-media-advanced
