name: Prepare DDG 8.5.42

on:
  push:
    branches:
      - release/8.5.42

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/8.5.42
          fetch-depth: 0
      - name: Prepare version and changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "8.5.42"
          Path("VERSION").write_text(version + "\n", encoding="utf-8")

          main_path = Path("main.go")
          main = main_path.read_text(encoding="utf-8")
          main, n = re.subn(
              r'const appVersion = "[^"]+"',
              f'const appVersion = "{version} Pro Smart Media Guard"',
              main,
              count=1,
          )
          if n != 1:
              raise SystemExit("appVersion marker not found exactly once")
          main_path.write_text(main, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "## [8.5.42]"
          if marker not in changelog:
              section = (
                  "## [8.5.42] — 2026-09-06\n\n"
                  "### GoFile — sesiune guest durabilă și protecție reală la rate-limit\n"
                  "- Tokenul guest creat de DDG este păstrat în `data/cache/gofile_guest_state.json` și reutilizat după restart sau update, în loc să fie recreat la fiecare pornire.\n"
                  "- Un token configurat prin `GOFILE_TOKEN`, `GOFILE_API_TOKEN` sau `GF_TOKEN` are prioritate și nu este persistat de DDG.\n"
                  "- `POST /accounts` nu mai este repetat după `429`: DDG salvează un cooldown și nu mai lovește endpointul până la expirarea lui; fallback-ul `gallery-dl` este oprit când cauza este rate-limit GoFile.\n"
                  "- Tokenul guest este invalidat numai pentru erori explicite de autentificare precum `error-wrongToken` sau `error-notAuthenticated`, nu pentru orice răspuns HTTP 401.\n"
                  "- Pentru metadata, DDG încearcă mai întâi candidații de website-token cu același account token și abia apoi decide dacă sesiunea trebuie refăcută.\n"
                  "- Valoarea implicită folosită de generatorul website-token este actualizată la `12af056dacea0b`, iar override-ul `GOFILE_WT_SALT` rămâne disponibil.\n"
                  "- Interogarea de metadata este aliniată la clientul web (`sortField=createTime`, `sortDirection=-1`), iar User-Agent-ul browser-like este folosit consecvent în formula WT și în cereri.\n"
                  "- Testele acoperă persistența tokenului, token configurat ne-persistent, cooldown-ul 429, fallback-ul website-token cu același cont și separarea erorilor de autentificare de cele de acces.\n\n"
                  "### Compatibilitate\n"
                  "- MEGA Preview și semantica de matching nu sunt modificate.\n\n"
              )
              changelog_path.write_text(section + changelog, encoding="utf-8")
          PY
          gofmt -w main.go
      - name: Commit release prep
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION main.go CHANGELOG.md
          git rm .github/workflows/prepare-8542-release.yml
          git commit -m "Prepare 8.5.42 release"
          git push origin HEAD:release/8.5.42
