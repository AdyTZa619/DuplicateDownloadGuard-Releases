name: TEST92 focused validation

on:
  push:
    branches:
      - fix/test92-local-preview-speed

permissions:
  contents: read

concurrency:
  group: test92-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify Go formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          Get-ChildItem -Filter *.go -File | ForEach-Object {
            $out = gofmt -l $_.FullName
            if ($out) { $bad += $out }
          }
          if ($bad.Count -gt 0) { $bad | Write-Host; throw 'gofmt required' }
      - name: Verify all UI JavaScript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem web -Filter *.js -File | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($_.Name)" }
          }
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Windows x64 build
        shell: pwsh
        run: |
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o DDG_TEST92_VALIDATION.exe .
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
