name: Apply v8.6 download diagnostic

on:
  push:
    branches:
      - feature/v8.6.0-media-orchestrator
    paths:
      - .github/workflows/apply-v860-download-diagnostic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v8.6.0-media-orchestrator
          fetch-depth: 0
      - name: Apply exact integration patch
        run: python tools/apply_v860_download_diagnostic.py
      - name: Format
        run: |
          gofmt -w main.go download_diagnostic_v860.go download_diagnostic_v860_test.go download_diagnostic_route_v860_test.go
          git diff --check
      - name: JavaScript syntax
        run: |
          node --check web/preview_quick_v86.js
          node --check web/download_diagnostic_v860.js
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Remove temporary helpers
        run: rm -f tools/apply_v860_download_diagnostic.py .github/workflows/apply-v860-download-diagnostic.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+AdyTZa619@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate end-to-end download diagnostics"
          git push origin HEAD:feature/v8.6.0-media-orchestrator
