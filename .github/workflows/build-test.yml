name: Build and publish DDG TEST updater

on:
  push:
    branches: [testing]
    paths-ignore:
      - 'test-releases/**'
      - 'update-test.json'
      - 'SHA256SUMS_TEST.txt'
      - 'STABILITY_CONTRACT.md'
      - 'stability/**'
      - '.github/workflows/stability-boundary.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ddg-publish-testing
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare TEST version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path VERSION)) { throw 'VERSION lipsește.' }
          $stable = (Get-Content -Raw VERSION).Trim()
          if ($stable -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "VERSION invalid: $stable" }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3] + 1
          $testVersion = "$major.$minor.$patch-test.$env:GITHUB_RUN_NUMBER"

          $main = Get-Content -Raw main.go
          $pattern = 'const appVersion = "[^"]+"'
          if (-not [regex]::IsMatch($main, $pattern)) { throw 'Nu am găsit appVersion în main.go.' }
          $replacement = 'const appVersion = "' + $testVersion + ' Pro Smart Media Guard TEST"'
          $main = [regex]::Replace($main, $pattern, $replacement, 1)

          [System.IO.File]::WriteAllText((Resolve-Path main.go), $main, [System.Text.UTF8Encoding]::new($false))

          # Rutele și comportamentul TEST sunt parte din sursa versionată.
          # CI schimbă numai eticheta versiunii; nu mai injectează funcții temporare.

          $subject = (git log -1 --pretty=%s).Trim()
          if ([string]::IsNullOrWhiteSpace($subject)) { $subject = 'build de test DDG' }
          "DDG_TEST_VERSION=$testVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DDG_TEST_SUBJECT=$subject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pregătit TEST $testVersion din baza Stable $stable"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Verify source formatting and all UI JavaScript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gofmt -w main.go v8_extra.go jdownloader_direct_v8550.go update_notify_windows.go provider_bunkr_official_v8560.go provider_gallery_scan.go provider_http_transport.go local_preview_diagnostics_v8599.go local_preview_routes_v8599.go generic_media_discovery_v85127.go generic_media_discovery_v85127_test.go lifecycle.go lifecycle_test.go
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed while normalizing TEST source patches' }
          $bad = @()
          Get-ChildItem -Filter *.go | ForEach-Object {
            $out = gofmt -l $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "gofmt failed: $($_.FullName)" }
            if ($out) { $bad += $out }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host $_ }
            throw 'Go formatting check failed; TEST aborted'
          }
          $scripts = @(Get-ChildItem -Path web -Filter *.js -File -Recurse)
          if ($scripts.Count -eq 0) { throw 'Nu există fișiere JavaScript în web/.' }
          foreach ($script in $scripts) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($script.Name)" }
          }
          $jsTests = @(Get-ChildItem -Path web/tests -Filter *.test.js -File -ErrorAction SilentlyContinue)
          foreach ($test in $jsTests) {
            node --test $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript behavior test failed: $($test.Name)" }
          }

      - name: Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed; TEST aborted' }

      - name: Vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed; TEST aborted' }

      - name: Build Windows x64 TEST
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o DuplicateDownloadGuard_PRO_TEST.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Build Windows x64 failed; TEST aborted' }

      - name: Generate TEST manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (Get-FileHash -Algorithm SHA256 DuplicateDownloadGuard_PRO_TEST.exe).Hash.ToLowerInvariant()
          $size = (Get-Item DuplicateDownloadGuard_PRO_TEST.exe).Length
          $url = 'https://raw.githubusercontent.com/AdyTZa619/DuplicateDownloadGuard-Releases/testing/test-releases/DuplicateDownloadGuard_PRO_TEST.exe'
          $publishedAt = [DateTime]::UtcNow.ToString('o')
          $manifest = [ordered]@{
            version = $env:DDG_TEST_VERSION
            url = $url
            sha256 = $sha
            notes = "TEST: $env:DDG_TEST_SUBJECT"
            publishedAt = $publishedAt
            channel = 'test'
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path $PWD 'update-test.json'), $manifest, [System.Text.UTF8Encoding]::new($false))
          "$sha  DuplicateDownloadGuard_PRO_TEST.exe" | Set-Content -Encoding ascii SHA256SUMS_TEST.txt
          "DDG_TEST_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DDG_TEST_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "TEST manifest: version=$env:DDG_TEST_VERSION size=$size sha256=$sha"

      - name: Publish TEST updater files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force test-releases | Out-Null
          Copy-Item DuplicateDownloadGuard_PRO_TEST.exe test-releases/DuplicateDownloadGuard_PRO_TEST.exe -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-releases/DuplicateDownloadGuard_PRO_TEST.exe update-test.json SHA256SUMS_TEST.txt
          git commit -m "Publish TEST updater build $env:DDG_TEST_VERSION [skip ci]"
          git push
