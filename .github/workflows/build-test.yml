name: Build and publish DDG TEST updater

on:
  push:
    branches: [testing]
    paths-ignore:
      - 'test-releases/**'
      - 'update-test.json'
      - 'SHA256SUMS_TEST.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ddg-publish-testing
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare TEST version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path VERSION)) { throw 'VERSION lipsește.' }
          $stable = (Get-Content -Raw VERSION).Trim()
          if ($stable -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "VERSION invalid: $stable" }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3] + 1
          $testVersion = "$major.$minor.$patch-test.$env:GITHUB_RUN_NUMBER"

          $main = Get-Content -Raw main.go
          $pattern = 'const appVersion = "[^"]+"'
          if (-not [regex]::IsMatch($main, $pattern)) { throw 'Nu am găsit appVersion în main.go.' }
          $replacement = 'const appVersion = "' + $testVersion + ' Pro Smart Media Guard TEST"'
          $main = [regex]::Replace($main, $pattern, $replacement, 1)

          # Fail-closed JDownloader routing. The normal queue remains guarded as
          # a fallback, but the UI now uses a dedicated endpoint which can never
          # call the integrated DDG downloader. The native notifier endpoint plays
          # the update chime from Windows, independent of WebView focus/autoplay.
          $oldQueueRoute = 'mux.HandleFunc("/api/queue/add", a.handleQueueAdd)'
          $newQueueRoutes = @'
          mux.HandleFunc("/api/queue/add", a.handleQueueAddRoutedV8550)
          mux.HandleFunc("/api/download/jdownloader-direct", a.handleJDownloaderDirectEndpointV8551)
          mux.HandleFunc("/api/update/native-notify", a.handleUpdateNativeNotifyV8554)
          '@
          if (-not $main.Contains($oldQueueRoute)) { throw 'Nu am găsit ruta /api/queue/add pentru protecția JDownloader.' }
          $main = $main.Replace($oldQueueRoute, $newQueueRoutes.TrimEnd())

          # Default pentru downloadurile integrate = folderul principal DDG
          # (directorul în care se află EXE-ul). Migrăm doar vechile default-uri:
          # <exe>\downloads și Windows Downloads. Orice alt folder ales manual rămâne.
          $defaultPattern = 'if\s+strings\.TrimSpace\(a\.cfg\.DownloadDir\)\s*==\s*""\s*\{\s*a\.cfg\.DownloadDir\s*=\s*portableDownloadsDir\(\)\s*\}'
          $newDefaultBlock = @'
          currentDownloadDir := strings.TrimSpace(a.cfg.DownloadDir)
          legacyPortableDownloads := filepath.Clean(filepath.Join(executableDir(), "downloads"))
          windowsDownloads := ""
          if home, err := os.UserHomeDir(); err == nil && strings.TrimSpace(home) != "" {
          	windowsDownloads = filepath.Clean(filepath.Join(home, "Downloads"))
          }
          if currentDownloadDir == "" ||
          	strings.EqualFold(filepath.Clean(currentDownloadDir), legacyPortableDownloads) ||
          	(windowsDownloads != "" && strings.EqualFold(filepath.Clean(currentDownloadDir), windowsDownloads)) {
          	a.cfg.DownloadDir = portableDownloadsDir()
          }
          '@
          if (-not [regex]::IsMatch($main, $defaultPattern)) { throw 'Nu am găsit blocul implicit DownloadDir pentru migrare.' }
          $main = [regex]::Replace($main, $defaultPattern, $newDefaultBlock.TrimEnd(), 1)
          [System.IO.File]::WriteAllText((Resolve-Path main.go), $main, [System.Text.UTF8Encoding]::new($false))

          $extra = Get-Content -Raw v8_extra.go
          $oldPortable = 'func portableDownloadsDir() string { return filepath.Join(executableDir(), "downloads") }'
          $newPortable = 'func portableDownloadsDir() string { return executableDir() }'
          if (-not $extra.Contains($oldPortable)) { throw 'Nu am găsit portableDownloadsDir pentru default-ul DDG root.' }
          $extra = $extra.Replace($oldPortable, $newPortable)

          # Integrated Bunkr downloads use gallery-dl itself. Do not emulate
          # Bunkr's rotating API/CDN headers in DDG's generic HTTP downloader.
          $queuePattern = 'default:\s*q\.update\(a, id, func\(x \*DownloadJob\) \{ x\.Stage = "HTTP: descarc direct cu resume" \}\)\s*path, err = internalDownloadV855\(ctx, res, dest, progress\)'
          $queueReplacement = @'
          default:
          	if strings.EqualFold(strings.TrimSpace(res.Remote.Source), "BUNKR") {
          		q.update(a, id, func(x *DownloadJob) { x.Stage = "BUNKR: gallery-dl oficial" })
          		path, err = a.galleryDLDownloadBunkrV8560(ctx, res, dest, progress)
          	} else {
          		q.update(a, id, func(x *DownloadJob) { x.Stage = "HTTP: descarc direct cu resume" })
          		path, err = internalDownloadV855(ctx, res, dest, progress)
          	}
          '@
          if (-not [regex]::IsMatch($extra, $queuePattern)) { throw 'Nu am găsit ruta internă de download pentru delegarea Bunkr.' }
          $extra = [regex]::Replace($extra, $queuePattern, $queueReplacement.TrimEnd(), 1)
          [System.IO.File]::WriteAllText((Resolve-Path v8_extra.go), $extra, [System.Text.UTF8Encoding]::new($false))

          # Bunkr is not maintained in DDG anymore at protocol level. Use the
          # official gallery-dl build/extractor for Bunkr metadata, fresh CDN
          # URLs, required Referer headers and integrated downloads. This avoids
          # chasing Bunkr API/domain changes in our own HTTP code.
          $galleryPath = 'provider_gallery_scan.go'
          $gallery = Get-Content -Raw $galleryPath
          $oldGalleryExe = 'exe := a.detectGalleryDL()'
          $newGalleryExe = @'
          exe := a.detectGalleryDL()
          if source == "BUNKR" {
          	exe = a.officialGalleryDLForBunkrV8560(ctx)
          }
          '@
          if (-not $gallery.Contains($oldGalleryExe)) { throw 'Nu am găsit detectorul gallery-dl din provider_gallery_scan.go.' }
          $gallery = $gallery.Replace($oldGalleryExe, $newGalleryExe.TrimEnd())
          [System.IO.File]::WriteAllText((Resolve-Path $galleryPath), $gallery, [System.Text.UTF8Encoding]::new($false))

          $transportPath = 'provider_http_transport.go'
          $transport = Get-Content -Raw $transportPath
          $oldContextExe = 'exe := detectGalleryDLForProviderV86()'
          $newContextExe = 'exe := preferredGalleryDLProviderV8560()'
          if (-not $transport.Contains($oldContextExe)) { throw 'Nu am găsit detectorul gallery-dl pentru refresh/preview.' }
          $transport = $transport.Replace($oldContextExe, $newContextExe)
          $oldContextArgs = 'args := []string{"-J", "--no-colors", "-o", "output.private=true", "-o", "output.jsonl=true", "--cookies-export", cookiePath, sourceURL}'
          $newContextArgs = @'
          args := []string{"-J", "--no-colors", "-o", "output.private=true", "-o", "output.jsonl=true", "--cookies-export", cookiePath}
          if providerSourceLabelV86(sourceURL) == "BUNKR" {
          	args = append(args, "-o", "extractor.bunkr.tlds=true")
          }
          args = append(args, sourceURL)
          '@
          if (-not $transport.Contains($oldContextArgs)) { throw 'Nu am găsit argumentele gallery-dl pentru refresh/preview.' }
          $transport = $transport.Replace($oldContextArgs, $newContextArgs.TrimEnd())
          [System.IO.File]::WriteAllText((Resolve-Path $transportPath), $transport, [System.Text.UTF8Encoding]::new($false))

          # Make JDownloader a real visible engine in the compiled UI, not an
          # option that only exists when a secondary JS file happens to load.
          $indexPath = 'web/index.html'
          $index = Get-Content -Raw $indexPath
          if ($index -notmatch 'option value="jdownloader"') {
            $oldEngineTail = '<option value="mega">MEGAcmd</option></select>'
            $newEngineTail = '<option value="mega">MEGAcmd</option><option value="jdownloader">JDownloader 2 — direct</option></select>'
            if (-not $index.Contains($oldEngineTail)) { throw 'Nu am găsit lista motoarelor de download în index.html.' }
            $index = $index.Replace($oldEngineTail, $newEngineTail)
          }

          # Legacy inline downloadSelected used cfg.downloadMethod and could ignore
          # the current selector until Save Rules. Force it to read the live value.
          $index = $index.Replace("let engine=cfg.downloadMethod||'auto';", "let engine=$('downloadMethod')?.value||cfg.downloadMethod||'auto';")

          # Final capture-phase guard is loaded in the real EXE. It calls only the
          # dedicated JDownloader endpoint, so ExactGuard/inline handlers cannot
          # enqueue the same click in DDG.
          $finalScript = '<script defer src="/jdownloader_final_v8551.js"></script>'
          if (-not $index.Contains($finalScript)) {
            if (-not $index.Contains('</body>')) { throw 'index.html nu conține </body> pentru injectarea guardului JDownloader.' }
            $index = $index.Replace('</body>', "$finalScript</body>")
          }
          [System.IO.File]::WriteAllText((Resolve-Path $indexPath), $index, [System.Text.UTF8Encoding]::new($false))

          if ($main -notmatch '/api/download/jdownloader-direct') { throw 'Ruta dedicată JDownloader nu a fost injectată.' }
          if ($main -notmatch '/api/update/native-notify') { throw 'Ruta nativă pentru notificarea update-ului nu a fost injectată.' }
          if ($index -notmatch 'jdownloader_final_v8551\.js') { throw 'Guardul final JDownloader nu a fost injectat în UI.' }
          if ($index -notmatch 'option value="jdownloader"') { throw 'Motorul JDownloader nu este vizibil în UI.' }

          $subject = (git log -1 --pretty=%s).Trim()
          if ([string]::IsNullOrWhiteSpace($subject)) { $subject = 'build de test DDG' }
          "DDG_TEST_VERSION=$testVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DDG_TEST_SUBJECT=$subject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pregătit TEST $testVersion din baza Stable $stable"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Verify source formatting and all UI JavaScript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gofmt -w main.go v8_extra.go jdownloader_direct_v8550.go update_notify_windows.go provider_bunkr_official_v8560.go provider_gallery_scan.go provider_http_transport.go
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed while normalizing TEST source patches' }
          $bad = @()
          Get-ChildItem -Filter *.go | ForEach-Object {
            $out = gofmt -l $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "gofmt failed: $($_.FullName)" }
            if ($out) { $bad += $out }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host $_ }
            throw 'Go formatting check failed; TEST aborted'
          }
          $scripts = @(Get-ChildItem -Path web -Filter *.js -File)
          if ($scripts.Count -eq 0) { throw 'Nu există fișiere JavaScript în web/.' }
          foreach ($script in $scripts) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($script.Name)" }
          }

      - name: Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed; TEST aborted' }

      - name: Vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed; TEST aborted' }

      - name: Build Windows x64 TEST
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force test-releases | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o test-releases/DuplicateDownloadGuard_PRO_TEST.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 TEST build failed' }
          if (-not (Test-Path 'test-releases/DuplicateDownloadGuard_PRO_TEST.exe')) { throw 'TEST EXE lipsește după build' }

      - name: Generate TEST manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'test-releases/DuplicateDownloadGuard_PRO_TEST.exe'
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{64}$') { throw 'SHA-256 TEST invalid.' }
          $url = 'https://raw.githubusercontent.com/AdyTZa619/DuplicateDownloadGuard-Releases/testing/test-releases/DuplicateDownloadGuard_PRO_TEST.exe'
          $manifest = [ordered]@{
            version = $env:DDG_TEST_VERSION
            url = $url
            sha256 = $sha
            notes = ('TEST: ' + $env:DDG_TEST_SUBJECT)
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            channel = 'test'
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 update-test.json
          "$sha  DuplicateDownloadGuard_PRO_TEST.exe" | Set-Content -Encoding ascii SHA256SUMS_TEST.txt

      - name: Publish TEST updater files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-releases/DuplicateDownloadGuard_PRO_TEST.exe update-test.json SHA256SUMS_TEST.txt
          if (git diff --cached --quiet) {
            Write-Host 'Nu sunt schimbări TEST de publicat.'
            exit 0
          }
          git commit -m "Publish TEST updater build $env:DDG_TEST_VERSION [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'git commit TEST failed' }
          git push
          if ($LASTEXITCODE -ne 0) { throw 'git push TEST failed' }
