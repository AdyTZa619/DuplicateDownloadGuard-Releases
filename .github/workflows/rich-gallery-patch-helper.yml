name: Rich gallery scanner patch helper

on:
  push:
    branches:
      - 'feature/rich-gallery-scan'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rich-gallery-scan
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Replace legacy gallery scanner and format
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'v7_extra.go'
          $text = Get-Content -Raw $path
          $pattern = '(?s)func \(a \*App\) probeGalleryDL\(ctx context\.Context, u string\) \(\[\]RemoteItem, error\) \{.*?\r?\n\}\r?\nfunc isLikelyHTML'
          $replacement = @'
          func (a *App) probeGalleryDL(ctx context.Context, u string) ([]RemoteItem, error) {
          	return a.probeGalleryDLRichV86(ctx, u)
          }
          func isLikelyHTML
          '@
          $regex = [regex]::new($pattern)
          $matches = $regex.Matches($text)
          if ($matches.Count -ne 1) { throw "Expected exactly one legacy probeGalleryDL block, found $($matches.Count)." }
          $text = $regex.Replace($text, $replacement, 1)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($false))
          gofmt -w v7_extra.go provider_gallery_scan.go
          git rm .github/workflows/rich-gallery-patch-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v7_extra.go provider_gallery_scan.go
          git commit -m 'Route gallery scans through rich provider metadata'
          git push origin HEAD:feature/rich-gallery-scan
