name: MEGA Preview 8.5.11 root reuse test

on:
  push:
    branches: [fix/v8511-mega-root-reuse-v859]
  workflow_dispatch:

concurrency:
  group: mega-preview-v8511-root-reuse-test
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v8511-mega-root-reuse-v859

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Format Go source in test workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Filter *.go -File | ForEach-Object FullName
          gofmt -w $files

      - name: JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem web -Filter *.js -File | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.Name)" }
          }

      - name: All Go tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }

      - name: Go vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }

      - name: Build Windows x64 test candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-Content main.go -Raw
          $src = $src.Replace('8.5.9 Pro Smart Media Guard', '8.5.11-test.3 MEGA Root Reuse')
          Set-Content -Path main.go -Value $src -Encoding utf8 -NoNewline
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o artifacts/DuplicateDownloadGuard_PRO_8.5.11-test.3_MEGA.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          (Get-FileHash -Algorithm SHA256 artifacts/DuplicateDownloadGuard_PRO_8.5.11-test.3_MEGA.exe).Hash.ToLowerInvariant() | Set-Content -Encoding ascii artifacts/SHA256.txt

      - name: Upload test candidate only
        uses: actions/upload-artifact@v4
        with:
          name: DDG-8.5.11-test.3-MEGA-ROOT-REUSE
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error
