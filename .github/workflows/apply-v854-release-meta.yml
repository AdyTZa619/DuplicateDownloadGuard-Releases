name: Apply v8.5.4 release metadata
on:
  push:
    branches: [fix/v8.5.4-download-flow]
    paths:
      - tools/apply_v854_release_meta.py
      - .github/workflows/apply-v854-release-meta.yml
permissions:
  contents: write
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply version and changelog
        run: python tools/apply_v854_release_meta.py
      - name: Verify metadata
        run: |
          test "$(cat VERSION)" = "8.5.4"
          grep -F '## [8.5.4]' CHANGELOG.md
      - name: Commit release metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+AdyTZa619@users.noreply.github.com"
          git add -A
          git commit -m "Prepare release v8.5.4 download reliability hotfix"
          git push
