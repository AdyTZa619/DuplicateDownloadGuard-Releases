name: TEST129 Erome refresh once

on:
  push:
    branches: ['feature/test129-provider-resilience']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Patch Erome refreshability
        shell: python
        run: |
          from pathlib import Path
          p = Path('provider_preview_proxy.go')
          s = p.read_text(encoding='utf-8')
          old = 'case "GOFILE", "BUNKR", "CYBERDROP", "GALLERY-DL":'
          new = 'case "GOFILE", "BUNKR", "CYBERDROP", "EROME", "GALLERY-DL":'
          if old not in s and new not in s:
              raise SystemExit('providerRefreshableSourceV86 marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: gofmt and push
        run: |
          gofmt -w provider_preview_proxy.go provider_resilience_v85129_test.go
          if git diff --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provider_preview_proxy.go provider_resilience_v85129_test.go
          git commit -m "TEST129: refresh expired Erome media lazily"
          git push
