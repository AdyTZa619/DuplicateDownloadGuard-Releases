name: TEST85 focused validation

on:
  push:
    branches:
      - work/test85-local-preview

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify all UI JavaScript syntax
        run: |
          for f in web/*.js; do node --check "$f"; done
      - name: Verify Go formatting
        run: |
          bad="$(gofmt -l $(find . -maxdepth 1 -name '*.go' -print))"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Windows x64 build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o /tmp/DuplicateDownloadGuard_PRO_TEST85.exe .
