  test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version + verify changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path VERSION)) { throw 'VERSION lipsește.' }
          if (-not (Test-Path CHANGELOG.md)) { throw 'CHANGELOG.md lipsește.' }
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION invalid: $version" }
          $changelog = Get-Content -Raw CHANGELOG.md
          if (-not $changelog.Contains("## [$version]")) { throw "CHANGELOG.md nu conține secțiunea ## [$version]" }

          $escapedVersion = [regex]::Escape($version)
          $section = [regex]::Match($changelog, "(?ms)^## \[$escapedVersion\][^\r\n]*\r?\n(?<body>.*?)(?=^## \[|\z)")
          if (-not $section.Success) { throw "Nu pot extrage jurnalul pentru $version." }
          $bullets = [regex]::Matches($section.Groups['body'].Value, '(?m)^- (.+)$') | ForEach-Object { $_.Groups[1].Value } | Select-Object -First 6
          if ($bullets.Count -gt 0) {
            $notesPreview = "Noutăți ${version}: " + ($bullets -join ' • ')
          } else {
            $notesPreview = "Noutăți $version — vezi CHANGELOG.md"
          }
          if ([string]::IsNullOrWhiteSpace($notesPreview)) { throw 'Rezumatul updaterului este gol.' }
          Write-Host $notesPreview

          $main = Get-Content -Raw main.go
          $pattern = 'const appVersion = "[^"]+"'
          if (-not [regex]::IsMatch($main, $pattern)) { throw 'Nu am găsit appVersion în main.go.' }
          $replacement = 'const appVersion = "' + $version + ' Pro Smart Media Guard"'
          $main = [regex]::Replace($main, $pattern, $replacement, 1)
          [System.IO.File]::WriteAllText((Resolve-Path main.go), $main, [System.Text.UTF8Encoding]::new($false))
          "DDG_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validare release $version cu jurnal prezent."

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Verify formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          Get-ChildItem -Filter *.go | ForEach-Object {
            $out = gofmt -l $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "gofmt failed: $($_.FullName)" }
            if ($out) { $bad += $out }
          }
          if ($bad.Count -gt 0) {
            Write-Host 'Go files requiring gofmt:'
            $bad | ForEach-Object { Write-Host $_ }
            throw 'Go formatting check failed'
          }

      - name: Verify all UI JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(Get-ChildItem -Path web -Filter *.js -File)
          if ($scripts.Count -eq 0) { throw 'Nu există fișiere JavaScript în web/.' }
          foreach ($script in $scripts) {
            Write-Host "node --check $($script.FullName)"
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($script.Name)" }
          }

      - name: Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }

      - name: Vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }

      - name: Windows x64 build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o DDG_VALIDATION.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 build failed' }

      - name: Upload Windows validation build
        uses: actions/upload-artifact@v4
        with:
          name: DDG-${{ env.DDG_VERSION }}-validation-${{ github.sha }}
          path: DDG_VALIDATION.exe
          if-no-files-found: error
          retention-days: 7
