name: DDG validation

on:
  push:
    branches:
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ddg-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-download-ux:
    if: github.ref == 'refs/heads/fix/download-ux-single-guard' && github.event_name == 'push' && github.event.head_commit.message != 'Apply download UX and JDownloader actions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/download-ux-single-guard
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('download_guard.go')
          s = p.read_text(encoding='utf-8')

          old = '''type DownloadGuardReport struct {
	Mode         string                  `json:"mode"`
	Decisions    []DownloadGuardDecision `json:"decisions"`
	Counts       map[string]int          `json:"counts"`
	ScannedFiles int                     `json:"scannedFiles"`
	ScannedBytes int64                   `json:"scannedBytes"`
	ScannedRoots []string                `json:"scannedRoots"`
	DurationMS   int64                   `json:"durationMs"`
}'''
          new = '''type DownloadGuardReport struct {
	Mode             string                  `json:"mode"`
	Decisions        []DownloadGuardDecision `json:"decisions"`
	Counts           map[string]int          `json:"counts"`
	ScannedFiles     int                     `json:"scannedFiles"`
	ScannedBytes     int64                   `json:"scannedBytes"`
	ScannedRoots     []string                `json:"scannedRoots"`
	DurationMS       int64                   `json:"durationMs"`
	ReusedFreshIndex bool                    `json:"reusedFreshIndex,omitempty"`
	IndexAgeMS       int64                   `json:"indexAgeMs,omitempty"`
}'''
          if old not in s:
              raise SystemExit('DownloadGuardReport marker not found')
          s = s.replace(old, new, 1)

          old = '''	paths = append(paths, configuredDownload, destination)
	return compactGuardRoots(paths)'''
          new = '''	paths = append(paths, configuredDownload, destination)
	if strings.TrimSpace(configuredDownload) == "" {
		paths = append(paths, portableDownloadsDir())
	}
	return compactGuardRoots(paths)'''
          if old not in s:
              raise SystemExit('guardRoots marker not found')
          s = s.replace(old, new, 1)

          old = '''	out := make([]FileEntry, 0, len(entries))
	for _, e := range entries {
		out = append(out, e)
	}
	return out, scan, nil
}'''
          new = '''	out := make([]FileEntry, 0, len(entries))
	for _, e := range entries {
		out = append(out, e)
	}
	a.rememberGuardRefreshV8545(scan)
	return out, scan, nil
}'''
          if old not in s:
              raise SystemExit('refresh return marker not found')
          s = s.replace(old, new, 1)

          old = '''	entries, scan, err := a.refreshLiveIndexForGuard(ctx, destination)
	if err != nil {
		return report, err
	}
	report.ScannedFiles, report.ScannedBytes, report.ScannedRoots = scan.Files, scan.Bytes, scan.Roots'''
          new = '''	entries, scan, indexAge, reusedFreshIndex := a.reuseFreshGuardIndexV8545(destination)
	var err error
	if !reusedFreshIndex {
		entries, scan, err = a.refreshLiveIndexForGuard(ctx, destination)
		if err != nil {
			return report, err
		}
	}
	report.ScannedFiles, report.ScannedBytes, report.ScannedRoots = scan.Files, scan.Bytes, scan.Roots
	report.ReusedFreshIndex = reusedFreshIndex
	if reusedFreshIndex {
		report.IndexAgeMS = indexAge.Milliseconds()
	}'''
          if old not in s:
              raise SystemExit('runDownloadGuard refresh marker not found')
          s = s.replace(old, new, 1)

          old = '''	a.logf("ExactGuard %s: %d download, %d duplicate blocate, %d review • scan live %d fișiere în %d ms", mode, report.Counts[guardDownload], report.Counts[guardDuplicate], report.Counts[guardReview], report.ScannedFiles, report.DurationMS)'''
          new = '''	indexSource := "scan live"
	if report.ReusedFreshIndex {
		indexSource = fmt.Sprintf("index proaspăt reutilizat (%d ms)", report.IndexAgeMS)
	}
	a.logf("ExactGuard %s: %d download, %d duplicate blocate, %d review • %s • %d fișiere în %d ms", mode, report.Counts[guardDownload], report.Counts[guardDuplicate], report.Counts[guardReview], indexSource, report.ScannedFiles, report.DurationMS)'''
          if old not in s:
              raise SystemExit('guard log marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          Path('download_guard_fresh_cache.go').write_text(r'''package main

import (
	"sort"
	"strings"
	"sync"
	"time"
)

// A download started immediately after a source comparison must not walk the
// same HDD roots a second time. The cache is deliberately short-lived: it
// removes duplicate work from the common click-through flow without turning a
// stale index into a long-lived download decision.
const guardFreshIndexTTLV8545 = 30 * time.Second

type guardRefreshSnapshotV8545 struct {
	At       time.Time
	RootsKey string
	Scan     guardScan
}

var guardRefreshSnapshotsV8545 sync.Map

func guardRootsKeyV8545(roots []string) string {
	keys := make([]string, 0, len(roots))
	for _, root := range roots {
		keys = append(keys, pathKey(root))
	}
	sort.Strings(keys)
	return strings.Join(keys, "\n")
}

func (a *App) rememberGuardRefreshV8545(scan guardScan) {
	guardRefreshSnapshotsV8545.Store(a, guardRefreshSnapshotV8545{
		At:       time.Now(),
		RootsKey: guardRootsKeyV8545(scan.Roots),
		Scan:     scan,
	})
}

func (a *App) reuseFreshGuardIndexV8545(destination string) ([]FileEntry, guardScan, time.Duration, bool) {
	raw, ok := guardRefreshSnapshotsV8545.Load(a)
	if !ok {
		return nil, guardScan{}, 0, false
	}
	snapshot, ok := raw.(guardRefreshSnapshotV8545)
	if !ok {
		return nil, guardScan{}, 0, false
	}
	age := time.Since(snapshot.At)
	if age < 0 || age > guardFreshIndexTTLV8545 {
		return nil, guardScan{}, age, false
	}
	roots := a.guardRoots(destination)
	if guardRootsKeyV8545(roots) != snapshot.RootsKey {
		return nil, guardScan{}, age, false
	}

	a.mu.RLock()
	entries := make([]FileEntry, 0, len(a.index))
	for _, entry := range a.index {
		if !isGuardTemporaryFile(entry.Path) {
			entries = append(entries, entry)
		}
	}
	a.mu.RUnlock()

	scan := snapshot.Scan
	scan.Roots = append([]string(nil), roots...)
	return entries, scan, age, true
}
''', encoding='utf-8')

          Path('download_guard_fresh_cache_test.go').write_text(r'''package main

import (
	"context"
	"crypto/sha256"
	"encoding/hex"
	"os"
	"path/filepath"
	"testing"
)

func TestDownloadGuardReusesFreshCompareIndexV8545(t *testing.T) {
	collection, download := t.TempDir(), t.TempDir()
	data := []byte("fresh-index-content-v8545")
	local := filepath.Join(collection, "renamed-local.bin")
	if err := os.WriteFile(local, data, 0644); err != nil {
		t.Fatal(err)
	}
	sum := sha256.Sum256(data)
	remote := RemoteItem{
		Name: "remote.bin", Size: int64(len(data)), Source: "HTTP",
		HashType: "sha256", Hash: hex.EncodeToString(sum[:]),
	}
	a := guardTestApp(t, collection, download, remote)
	a.cfg.LiveRefreshCompare = true
	a.compareRemote(context.Background(), []RemoteItem{remote}, "balanced")

	report, err := a.runDownloadGuard(context.Background(), a.results, download, guardModeSmart)
	if err != nil {
		t.Fatal(err)
	}
	if !report.ReusedFreshIndex {
		t.Fatalf("expected fresh index reuse: %#v", report)
	}
	if report.IndexAgeMS < 0 || report.IndexAgeMS > guardFreshIndexTTLV8545.Milliseconds() {
		t.Fatalf("unexpected index age: %dms", report.IndexAgeMS)
	}
	if got := report.Decisions[0]; got.Verdict != guardDuplicate || got.LocalPath != local {
		t.Fatalf("unexpected decision: %#v", got)
	}
}
''', encoding='utf-8')

          Path('web/download_actions_v8545.js').write_text(r'''(() => {
  'use strict';

  let installed = false;
  let installing = false;

  function guardCounts(data) {
    const c = data?.guard?.counts || data?.counts || {};
    return {
      duplicate: Number(c.DUPLICATE || 0),
      review: Number(c.REVIEW || 0),
      download: Number(c.DOWNLOAD || 0)
    };
  }

  function needsAttention(data) {
    const c = guardCounts(data);
    const rejected = Array.isArray(data?.rejected) ? data.rejected.length : 0;
    return c.duplicate > 0 || c.review > 0 || rejected > 0;
  }

  async function rowsForIDs(ids) {
    const wanted = new Set(ids.map(Number));
    const rows = [];
    let offset = 0;
    for (let page = 0; page < 100 && wanted.size; page++) {
      const data = await api(`/api/results?offset=${offset}&limit=1000&status=ALL`);
      const batch = Array.isArray(data.rows) ? data.rows : [];
      for (const row of batch) {
        if (wanted.has(Number(row.id))) {
          rows.push(row);
          wanted.delete(Number(row.id));
        }
      }
      if (!batch.length || offset + batch.length >= Number(data.total || 0)) break;
      offset += batch.length;
    }
    return rows;
  }

  function gofileJDURL(row) {
    const r = row?.remote || {};
    if (String(r.source || '').toUpperCase() !== 'GOFILE' || !r.providerId) return '';
    try {
      const u = new URL(r.url || '');
      const parts = u.pathname.split('/').filter(Boolean);
      if (parts.length >= 2 && parts[0].toLowerCase() === 'd' && parts[1]) {
        return `https://gofile.io/?c=${encodeURIComponent(parts[1])}#file=${encodeURIComponent(r.providerId)}`;
      }
    } catch (_) {}
    return '';
  }

  function jdURLForRow(row) {
    const r = row?.remote || {};
    const gofile = gofileJDURL(row);
    if (gofile) return gofile;
    return String(r.directUrl || r.url || '').trim();
  }

  function checkJDownloader() {
    return new Promise(resolve => {
      const old = document.getElementById('ddgJDCheckScript');
      if (old) old.remove();
      window.jdownloader = false;
      const script = document.createElement('script');
      script.id = 'ddgJDCheckScript';
      script.src = `http://127.0.0.1:9666/jdcheck.js?_ddg=${Date.now()}`;
      let done = false;
      const finish = value => {
        if (done) return;
        done = true;
        script.remove();
        resolve(Boolean(value));
      };
      script.onload = () => finish(window.jdownloader === true);
      script.onerror = () => finish(false);
      document.head.appendChild(script);
      setTimeout(() => finish(window.jdownloader === true), 1200);
    });
  }

  function submitToJDownloader(rows, destination) {
    const urls = [];
    const names = [];
    const seen = new Set();
    for (const row of rows) {
      const url = jdURLForRow(row);
      if (!url || seen.has(url)) continue;
      seen.add(url);
      urls.push(url);
      names.push(row?.remote?.name || row?.remote?.path || 'DDG');
    }
    if (!urls.length) throw new Error('Selecția nu conține linkuri compatibile cu JDownloader.');

    let iframe = document.getElementById('ddgJDTarget');
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.id = 'ddgJDTarget';
      iframe.name = 'ddgJDTarget';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = 'http://127.0.0.1:9666/flashgot';
    form.target = 'ddgJDTarget';
    form.style.display = 'none';
    const add = (name, value) => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = value;
      form.appendChild(input);
    };
    add('urls', urls.join('\n'));
    add('description', names.join('\n'));
    add('package', 'Duplicate Download Guard');
    add('referer', 'https://gofile.io/');
    if (destination) add('dir', destination);
    document.body.appendChild(form);
    form.submit();
    setTimeout(() => form.remove(), 1500);
    return urls.length;
  }

  async function folderWatchFallback(ids) {
    const folder = String(cfg?.jdFolder || '').trim();
    if (!folder) return false;
    const data = await api('/api/download/jd2', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids, folder })
    });
    toast(`JDownloader FolderWatch: ${data.count || 0} link(uri) pregătite`);
    return true;
  }

  async function sendSelectedJDownloaderV8545() {
    const ids = typeof idsForAction === 'function' ? idsForAction() : [];
    if (!ids.length) return toast('Selectează fișiere');
    const button = document.getElementById('jdSelectedBtn');
    if (button) {
      button.disabled = true;
      button.textContent = '⏳ JDownloader…';
    }
    try {
      const destination = document.getElementById('downloadDir')?.value?.trim() || cfg?.downloadDir || '';
      const mode = document.getElementById('downloadGuardMode')?.value || cfg?.downloadGuardMode || 'smart';
      const guard = await api('/api/download/preflight', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids, destination, mode })
      });
      const allowed = new Set((guard.decisions || []).filter(x => x.verdict === 'DOWNLOAD').map(x => Number(x.resultId)));
      if (!allowed.size) {
        if (typeof showGuardReport === 'function') showGuardReport(guard, { ids, destination, guardMode: mode }, 0);
        return toast('Nimic de trimis: selecția este duplicat sau necesită verificare');
      }
      const rows = await rowsForIDs([...allowed]);
      const running = await checkJDownloader();
      if (!running) {
        if (await folderWatchFallback([...allowed])) return;
        throw new Error('JDownloader nu răspunde pe 127.0.0.1:9666. Pornește JDownloader sau setează FolderWatch în Reguli.');
      }
      const count = submitToJDownloader(rows, destination);
      if (guardCounts({ guard }).duplicate > 0 || guardCounts({ guard }).review > 0) {
        if (typeof showGuardReport === 'function') showGuardReport(guard, { ids, destination, guardMode: mode }, count);
      }
      toast(`Trimis în JDownloader LinkGrabber: ${count} fișier(e)`);
    } catch (error) {
      toast(error.message || String(error));
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = '↗ JDownloader';
      }
    }
  }

  async function downloadSelectedV8545() {
    const ids = typeof idsForAction === 'function' ? idsForAction() : [];
    if (!ids.length) return toast('Selectează fișiere');
    const destination = document.getElementById('downloadDir')?.value?.trim() || cfg?.downloadDir || '';
    const engine = document.getElementById('downloadMethod')?.value || cfg?.downloadMethod || 'auto';
    const mode = document.getElementById('downloadGuardMode')?.value || cfg?.downloadGuardMode || 'smart';
    const request = { ids, engine, destination, guardMode: mode };
    const button = document.getElementById('downloadGuardBtn');
    if (button) {
      button.disabled = true;
      button.textContent = '⏳ Pregătesc…';
    }
    if (typeof showActivity === 'function') showActivity(`Pregătesc ${ids.length} fișier(e) pentru download…`);
    try {
      const data = await api('/api/queue/add', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(request)
      });
      if (typeof loadResults === 'function') await loadResults();
      if (needsAttention(data)) {
        if (typeof showGuardReport === 'function') showGuardReport(data.guard, request, data.added);
      } else {
        const modal = document.getElementById('guardModal');
        if (modal && !modal.classList.contains('hidden') && typeof closeGuardReport === 'function') closeGuardReport();
      }
      if (typeof loadQueue === 'function') await loadQueue();
      const reused = data?.guard?.reusedFreshIndex === true;
      if (data.added > 0) {
        toast(`${data.added} fișier(e) în coadă${reused ? ' • fără a rescana HDD-ul' : ''}`);
        if (!needsAttention(data) && typeof goTab === 'function') goTab('downloads');
      } else if (!needsAttention(data)) {
        toast('Niciun fișier nou nu a fost adăugat în coadă');
      }
    } catch (error) {
      toast(error.message || String(error));
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = '⬇ Descarcă';
      }
    }
  }

  function installButtons() {
    const download = document.getElementById('downloadGuardBtn') || document.querySelector('button[onclick="downloadSelected()"]');
    if (!download) return false;
    download.textContent = '⬇ Descarcă';
    download.title = 'Un click: verificarea de siguranță rulează în fundal; dacă indexul tocmai a fost actualizat, DDG nu mai rescanează HDD-ul.';

    if (!document.getElementById('jdSelectedBtn')) {
      const jd = document.createElement('button');
      jd.className = 'btn';
      jd.id = 'jdSelectedBtn';
      jd.type = 'button';
      jd.textContent = '↗ JDownloader';
      jd.title = 'Trimite numai fișierele selectate și confirmate ca lipsă în JDownloader LinkGrabber. Dacă JDownloader nu rulează, folosește FolderWatch configurat.';
      jd.addEventListener('click', sendSelectedJDownloaderV8545);
      download.insertAdjacentElement('afterend', jd);
    }
    window.downloadSelected = downloadSelectedV8545;
    window.sendSelectedJD2 = sendSelectedJDownloaderV8545;
    return true;
  }

  function install() {
    if (installing) return;
    installing = true;
    let tries = 0;
    const timer = setInterval(() => {
      tries++;
      if (installButtons()) {
        installed = true;
        clearInterval(timer);
      } else if (tries >= 80) {
        clearInterval(timer);
      }
    }, 100);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(install, 0), { once: true });
  } else {
    install();
  }
  window.ddgDownloadActionsV8545 = { install, sendSelectedJDownloaderV8545 };
})();
''', encoding='utf-8')

