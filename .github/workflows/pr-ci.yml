name: DDG repair CI

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ddg-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply repair patch
        if: github.event_name == 'push'
        shell: pwsh
        run: python fixes/apply_841.py

      - name: Format Go
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.go | ForEach-Object { gofmt -w $_.FullName }

      - name: Tests and vet
        shell: pwsh
        run: |
          go test ./...
          go vet ./...

      - name: Windows x64 build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o DDG_REPAIR_CHECK.exe .

      - name: Commit repaired source
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.go web/index.html *.go
          if (git diff --cached --quiet) {
            Write-Host 'Source already current.'
            exit 0
          }
          git commit -m 'Wire v8.4.1 lifecycle shutdown and UI heartbeat'
          git push origin HEAD:${{ github.ref_name }}
