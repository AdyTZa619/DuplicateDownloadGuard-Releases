name: TEST98 focused validation

on:
  push:
    branches:
      - work/test98-mega-results-visibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify UI JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem web -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Verify Go formatting
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) { $bad; exit 1 }
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Windows x64
        run: go build -o DuplicateDownloadGuard_TEST98.exe .
