name: TEST104 local dedicated preview validation

on:
  push:
    branches:
      - fix/test104-local-dedicated-log-unblock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify UI JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem web -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Verify Go formatting
        shell: pwsh
        run: |
          gofmt -w local_preview_fastpath_v85102.go local_preview_diagnostics_v8599_test.go
          $bad = gofmt -l .
          if ($bad) { $bad; exit 1 }
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Windows x64
        shell: pwsh
        run: |
          $env:CGO_ENABLED='0'
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -o DuplicateDownloadGuard_TEST104.exe .
