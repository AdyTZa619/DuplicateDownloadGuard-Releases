name: Provider preview integration helper

on:
  push:
    branches:
      - 'feature/provider-preview-proxy'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-preview-proxy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Integrate provider preview proxy
        shell: pwsh
        run: |
          ./.github/provider-preview-patch.ps1
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
          go build -o DuplicateDownloadGuard_PRO_provider-preview.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.go provider_preview_proxy.go provider_preview_url.go provider_preview_proxy_test.go
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Integrate provider preview proxy'
            git push origin HEAD:feature/provider-preview-proxy
          }
