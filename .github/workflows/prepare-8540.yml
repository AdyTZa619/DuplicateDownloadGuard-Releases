name: Prepare DDG 8.5.40

on:
  push:
    branches: ["fix/gofile-401-429"]

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gofile-401-429
      - name: Prepare release metadata
        shell: python
        run: |
          from pathlib import Path

          version = "8.5.40"
          Path("VERSION").write_text(version + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          old = changelog.read_text(encoding="utf-8")
          section = """## [8.5.40] - 2026-09-06
          - Repară `GoFile API HTTP 401`: DDG folosește saltul curent pentru `X-Website-Token`, sincronizat cu protocolul GoFile actual.
          - La `401`, tokenul guest din RAM este invalidat și refăcut o singură dată înainte de a declara scanarea eșuată.
          - La `429 Too Many Requests`, DDG nu mai cade imediat în fallback: respectă `Retry-After` când este furnizat și reîncearcă controlat de până la 5 ori.
          - Cererile native GoFile sunt distanțate cu minimum 500 ms pentru a reduce declanșarea rate-limit-ului pe foldere și subfoldere.
          - Saltul GoFile poate fi suprascris prin `GOFILE_WT_SALT` fără recompilare dacă providerul îl rotește din nou.
          - MEGA Preview, matching-ul și celelalte providere nu sunt modificate.

          """
          section = "\n".join(line[10:] if line.startswith("          ") else line for line in section.splitlines()) + "\n"
          if "## [8.5.40]" not in old:
              changelog.write_text(section + old, encoding="utf-8")
      - name: Format and verify
        run: |
          gofmt -w provider_gofile_native.go provider_gofile_native_test.go
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/ddg.exe .
      - name: Commit release metadata and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/prepare-8540.yml
          git add VERSION CHANGELOG.md provider_gofile_native.go provider_gofile_native_test.go
          git commit -m "Prepare 8.5.40 release"
          git push origin HEAD:fix/gofile-401-429
