name: Apply v8.6 HTML fallback

on:
  push:
    branches:
      - feature/v8.6.0-media-orchestrator
    paths:
      - .github/workflows/apply-v860-html-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v8.6.0-media-orchestrator
          fetch-depth: 0
      - name: Apply exact HTML fallback patch
        run: python tools/apply_v860_html_fallback.py
      - name: Format
        run: |
          gofmt -w v7_extra.go web_media_discovery_v860.go web_media_discovery_v860_test.go
          git diff --check
      - name: JavaScript syntax
        run: node --check web/preview_quick_v86.js
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Remove temporary helpers
        run: rm -f tools/apply_v860_html_fallback.py .github/workflows/apply-v860-html-fallback.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate generic HTML media discovery fallback"
          git push origin HEAD:feature/v8.6.0-media-orchestrator
